[package]
name = "tessari-vault-crypto"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
# Integration tests are declared one binary per crate when they exist; never one per file under `tests/`.
autotests = false

[lib]
doctest = false
# `cdylib` is the WebAssembly module the panel loads; `rlib` is what the server's tests link.
crate-type = ["rlib", "cdylib"]

[dependencies]
tessari-vault-constants.workspace = true
tessari-vault-types.workspace = true
argon2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[lints]
workspace = true
