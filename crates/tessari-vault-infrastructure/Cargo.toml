[package]
name = "tessari-vault-infrastructure"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
# Integration tests are declared one binary per crate when they exist; never one per file under `tests/`.
autotests = false

[lib]
doctest = false

[dependencies]
url.workspace = true
tessari-vault-constants.workspace = true
tessaridb-client.workspace = true
ring.workspace = true
tessaridb-oauth-client.workspace = true
tessaridb-s3-client.workspace = true
async-trait.workspace = true
# The server's verifier needs the PHC string form the browser build leaves out.
argon2 = { workspace = true, features = ["password-hash"] }
unicode-normalization.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util"] }
tracing.workspace = true
thiserror.workspace = true
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
