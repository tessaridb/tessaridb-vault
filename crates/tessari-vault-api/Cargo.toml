[package]
name = "tessari-vault-api"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
# Integration tests are declared one binary per crate when they exist; never one per file under `tests/`.
autotests = false

[lib]
doctest = false

[dependencies]
zeroize.workspace = true
tessari-vault-constants.workspace = true
tessari-vault-types.workspace = true
tessari-vault-core.workspace = true
tessari-vault-storage.workspace = true
axum.workspace = true
serde.workspace = true
tracing.workspace = true

[lints]
workspace = true

[[test]]
name = "live"
path = "tests/live/main.rs"

[dev-dependencies]
tessari-vault-infrastructure.workspace = true
serde_json.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
