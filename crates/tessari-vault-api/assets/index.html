<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>TessariDB Vault</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a id="skip" class="skip" href="#view">Skip to content</a>
    <div class="shell">
      <aside class="side">
        <div class="identity">
          <p class="brand"><img class="logo" src="/favicon.svg" alt="" width="28" height="28" /><span>TessariDB Vault</span></p>
          <div id="workspace" class="workspace" hidden>
            <p class="caption">Company</p>
            <p id="company" class="company"></p>
          </div>
        </div>
        <button id="menu-toggle" type="button" class="quiet menu-toggle" data-icon="menu" aria-expanded="false" aria-controls="side-menu"><span>Menu</span></button>
        <div id="side-menu" class="side-menu">
        <nav aria-label="Sections">
          <a href="#/" data-section="records" data-icon="records"><span>Records</span></a>
          <a href="#/members" data-section="members" data-icon="members"><span>Members</span></a>
          <a href="#/groups" data-section="groups" data-icon="groups"><span>Groups</span></a>
          <a href="#/trail" data-section="trail" data-icon="trail"><span>Trail</span></a>
          <a href="#/recovery" data-section="recovery" data-icon="recovery"><span>Recovery</span></a>
          <a href="#/company" data-section="company" data-icon="company"><span>Company</span></a>
          <a href="#/account" data-section="account" data-icon="account"><span>Account</span></a>
        </nav>
        <div class="side-foot">
          <div id="account" class="account" hidden>
            <p class="caption">Signed in as</p>
            <p id="account-name" class="account-name"></p>
            <p id="account-email" class="account-email"></p>
          </div>
          <button id="theme" type="button" class="quiet" data-icon="moon"><span>Dark theme</span></button>
          <button id="switch-company" type="button" class="quiet" data-icon="switch" hidden><span>Switch company</span></button>
          <button id="lock" type="button" class="quiet" data-icon="lock"><span>Lock</span></button>
          <button id="sign-out" type="button" class="quiet" data-icon="sign-out"><span>Sign out</span></button>
        </div>
        </div>
      </aside>
      <main id="view" tabindex="-1">
        <noscript><p>The vault encrypts and decrypts records in this page, so it needs JavaScript.</p></noscript>
      </main>
    </div>
    <footer class="foot">
      <p id="status-line" role="status" aria-live="polite"></p>
      <p class="credit">© boogvar 2026 · Powered by TessariDB</p>
    </footer>
  </body>
</html>
