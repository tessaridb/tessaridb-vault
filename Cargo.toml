[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "BUSL-1.1"
authors = ["boogvar"]
repository = "https://github.com/tessaridb/tessaridb-vault"
publish = false

[workspace.dependencies]
tessari-vault-constants = { path = "crates/tessari-vault-constants" }
tessari-vault-types = { path = "crates/tessari-vault-types" }
tessari-vault-core = { path = "crates/tessari-vault-core" }
tessari-vault-crypto = { path = "crates/tessari-vault-crypto" }
tessari-vault-observability = { path = "crates/tessari-vault-observability" }
tessari-vault-infrastructure = { path = "crates/tessari-vault-infrastructure" }
tessari-vault-storage = { path = "crates/tessari-vault-storage" }
tessari-vault-api = { path = "crates/tessari-vault-api" }
tessari-vault-daemons = { path = "crates/tessari-vault-daemons" }

thiserror = "2"
libc = "0.2"
# Argon2id (RFC 9106) for the unlock derivation, the same pinned line the family's OAuth server uses; no default
# features, so the browser build carries no random-number source and no password-hash string format.
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
# Key material is cleared from memory when its holder drops.
zeroize = "1"
# Sign-in passwords are put in Normalization Form C before they are hashed (NIST SP 800-63B-4 §3.1.1.2).
unicode-normalization = "0.1"
# Sign-in through TessariDB OAuth or any OpenID Connect issuer: the family's client, pinned by revision until its first
# release, which comes before this product's (Q-VA-18).
tessaridb-oauth-client = { git = "https://github.com/tessaridb/tessaridb-oauth-client", rev = "c0f8954e37cfe6cd0945fcc2d5d9cffe211e7945" }
# The store and its client: the published Rust client, at the release that speaks protocol minor 7 (keyed vaults).
tessaridb-client = "=0.13.1"
# Randomness for identifiers and session tokens, and the digest a session is stored under.
ring = "0.17"
# COSE keys and CBOR for passkeys (RFC 9052 / RFC 9053).
coset = "=0.4.2"
# Constant-time comparison of one-time codes.
subtle = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
# Reading the issuer's return query.
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
tokio = { version = "1", default-features = false }
tracing = "0.1"
# The binary's subscriber: JSON events, a filter from `RUST_LOG`, and a writer on its own thread.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "json", "fmt", "std"] }
tracing-appender = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
unwrap_used = "deny"
panic = "deny"
expect_used = "deny"
arithmetic_side_effects = "deny"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.dev.build-override]
opt-level = 3
